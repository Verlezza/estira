<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estira</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="quiz" hidden>
    <div class="progress" aria-hidden="true"><i id="quiz-bar"></i></div>
    <div id="quiz-body" class="grow"></div>
  </section>

  <section id="home" hidden>
    <header class="top">
      <h1>Estira</h1>
      <button class="ghost" id="go-settings" data-i18n="settings"></button>
    </header>
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="52"/>
        <circle class="bar" id="ring-bar" cx="60" cy="60" r="52" pathLength="100"/>
      </svg>
      <div class="ring-text"><small id="home-label"></small><strong id="home-time">--:--</strong></div>
    </div>
    <p class="muted center" id="home-today"></p>
    <div class="tip update" id="update" hidden><span id="update-text"></span><button id="update-btn" data-i18n="update_now"></button></div>
    <div class="grow"></div>
    <button class="primary" id="now" data-i18n="stretch_now"></button>
    <div class="row">
      <button id="pause"></button>
      <button id="go-catalog" data-i18n="see_stretches"></button>
    </div>
  </section>

  <section id="remind" hidden>
    <div class="grow"></div>
    <h2 class="big" data-i18n="time_to_stretch"></h2>
    <p class="muted" id="remind-sub"></p>
    <ul class="pills" id="remind-list"></ul>
    <div class="grow"></div>
    <button class="primary" id="start" data-i18n="start"></button>
    <div class="row">
      <button id="snooze" data-i18n="snooze"></button>
      <button id="skip" data-i18n="skip"></button>
    </div>
  </section>

  <section id="session" hidden>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <svg class="anim" id="anim" role="img" data-i18n-label="anim_label"></svg>
    <p class="side" id="side"></p>
    <h2 id="ex-name"></h2>
    <ol class="steps" id="ex-steps"></ol>
    <p class="caution" id="ex-caution"></p>
    <div class="grow"></div>
    <div class="count"><div class="track"><i id="count-bar"></i></div><span id="count-num" aria-live="off"></span></div>
    <div class="row">
      <button id="hold"></button>
      <button class="primary" id="next"></button>
    </div>
    <button class="link" id="end" data-i18n="end_break"></button>
  </section>

  <section id="done" hidden>
    <div class="grow"></div>
    <h2 class="big" data-i18n="well_done"></h2>
    <p class="muted" id="done-next"></p>
    <p class="tip" id="done-tip"></p>
    <div class="grow"></div>
    <button class="primary" id="done-close" data-i18n="back_to_work"></button>
  </section>

  <section id="catalog" hidden>
    <header class="top">
      <button class="ghost" data-back data-i18n="back"></button>
      <h1 data-i18n="stretches"></h1>
    </header>
    <p class="muted" data-i18n="catalog_note"></p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="settings" hidden>
    <header class="top">
      <button class="ghost" data-back data-i18n="back"></button>
      <h1 data-i18n="settings"></h1>
    </header>
    <dl class="summary" id="summary"></dl>
    <label class="check"><input type="checkbox" id="opt-sound"> <span data-i18n="sound"></span></label>
    <label class="check" id="autostart-row" hidden><input type="checkbox" id="opt-autostart"> <span data-i18n="autostart"></span></label>
    <label class="field"><span data-i18n="language"></span> <select id="opt-lang"></select></label>
    <div class="grow"></div>
    <button class="primary" id="redo-quiz" data-i18n="redo_quiz"></button>
    <p class="muted small" data-i18n="legal"></p>
  </section>
</main>

<dialog id="detail">
  <svg class="anim" id="detail-anim" role="img" data-i18n-label="anim_label"></svg>
  <h2 id="detail-name"></h2>
  <p class="muted" id="detail-meta"></p>
  <ol class="steps" id="detail-steps"></ol>
  <p class="caution" id="detail-caution"></p>
  <form method="dialog"><button class="primary" data-i18n="close"></button></form>
</dialog>

<script src="i18n.js"></script>
<script src="exercises.js"></script>
<script src="figure.js"></script>
<script src="app.js"></script>
</body>
</html>
