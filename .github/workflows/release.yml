# Compila los instaladores de Windows y Mac en GitHub y los publica en Releases.
# Se activa al subir una etiqueta como v0.1.0, o a mano desde la pestaña Actions.
name: Instaladores
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
            rust-targets: ''
          # Un solo .dmg universal: funciona en Mac con Apple Silicon (M1 y posteriores) y con Intel.
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma las actualizaciones automáticas (clave creada con `npx tauri signer generate`).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Reed v__VERSION__
          releaseBody: |
            **Windows:** descarga `Reed_..._x64-setup.exe` y ábrelo para instalar.
            **Mac:** descarga `Reed_..._universal.dmg`, ábrelo y arrastra Reed a Aplicaciones. La primera vez, macOS dirá que no puede verificar la app: ve a Ajustes del Sistema → Privacidad y seguridad → "Abrir igualmente".
          releaseDraft: false
          args: ${{ matrix.args }}
